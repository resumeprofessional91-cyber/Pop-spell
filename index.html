<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pop and Spell</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#dff1ff;--ink:#14275a;--pink:#ee2f6b;--blue:#1f4fd8;--yel:#ffd21f;--org:#f59a23;--grn:#6bb52e;--sky:#38b6f2;--chip:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a3a;--ink:#eef4ff;--chip:#1b2c5e}}
:root[data-theme="dark"]{--bg:#0e1a3a;--ink:#eef4ff;--chip:#1b2c5e}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center;padding:14px}
.app{width:100%;max-width:800px;position:relative}
.sr{position:absolute;left:-9999px}
.frame{position:relative;container-type:inline-size;border-radius:30px;overflow:hidden;background:#fff;box-shadow:0 10px 30px rgba(20,39,90,.2)}
.frame img{display:block;width:100%;height:auto}
.win{display:grid;place-items:center;font-weight:800;line-height:1}
.slots{position:absolute;inset:0;transform-origin:50% 61%}
.slots.in{animation:flipin .6s cubic-bezier(.3,1.5,.5,1)}@keyframes flipin{from{transform:scale(.5) rotate(-6deg);opacity:0}}
.found{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:34px;margin:2px 0 6px}.found span{background:var(--yel);color:#14275a;border-radius:999px;padding:2px 14px;font-weight:800;font-size:20px}
.slots.wrongw .win{animation:shake .4s;border-color:#ee2f6b}
.bal.back{animation:back .4s}@keyframes back{from{transform:scale(0)}to{transform:scale(1)}}
.lvb small{font-weight:600;opacity:.8}
.orig .win{position:absolute;top:47.9%;height:26.4%;width:17.8%;font-size:17cqw}
.orig .w0{left:20.2%}.orig .w1{left:40.7%}.orig .w2{left:62.2%}
.gen{inset:auto;left:19.5%;width:62%;top:46.8%;height:28%;display:flex;justify-content:center;align-items:center;gap:1.6cqw}
.gen .win{width:var(--w);aspect-ratio:1;font-size:var(--fs);background:#f3f9ff;border:.9cqw solid #38b6f2;border-radius:3cqw;box-shadow:inset 0 .6cqw 1.4cqw rgba(31,79,216,.15)}
.win:nth-child(5n+1){color:#ee2f6b}.win:nth-child(5n+2){color:#1f4fd8}.win:nth-child(5n+3){color:#6bb52e}.win:nth-child(5n+4){color:#f59a23}.win:nth-child(5n+5){color:#9b51e0}
.cover{position:absolute;left:18.7%;width:63.6%;top:44.9%;height:30.2%;background:rgb(249,251,253);display:none;clip-path:polygon(0 0,100% 0,100% 79.6%,97.1% 79.6%,97.1% 100%,5.4% 100%,5.4% 93.8%,0 93.8%)}
.lv{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:12px 0 2px}
.lvb{font:inherit;font-weight:800;font-size:15px;border:0;border-radius:999px;padding:4px 12px;background:var(--chip);color:var(--ink);cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.lvb.on{background:var(--yel);color:#14275a}
.win.next{animation:blink 1.1s infinite}
.win span{animation:pop .4s cubic-bezier(.3,1.9,.5,1);text-shadow:0 4px 0 rgba(20,39,90,.18)}
@keyframes blink{50%{background:rgba(255,210,31,.35)}}@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;margin:14px 0 4px}
.chip,.clue,.ic{font:inherit;font-weight:800;border:0;border-radius:999px;cursor:pointer;color:#14275a}
.clue{display:flex;align-items:center;gap:10px;background:var(--yel);padding:4px 16px 4px 10px;font-size:20px}
.clue .em{font-size:42px;line-height:1}
.chip{background:var(--chip);color:var(--ink);padding:6px 14px;font-size:19px;cursor:default;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.ic{background:var(--chip);color:var(--ink);width:46px;height:46px;font-size:22px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.tray{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:10px 16px;min-height:130px;padding-top:12px}
.bal{position:relative;width:76px;height:92px;border:0;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;font:inherit;font-weight:800;font-size:40px;color:#fff;cursor:pointer;text-transform:lowercase;animation:float 3s ease-in-out infinite;box-shadow:inset -8px -10px 0 rgba(0,0,0,.12),inset 8px 8px 0 rgba(255,255,255,.25)}
.bal::before{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-bottom:9px solid currentColor;border-top:0;color:inherit}
.bal::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:26px;background:rgba(127,127,127,.6)}
.bal:nth-child(2n){animation-delay:-1s}.bal:nth-child(3n){animation-delay:-2s}
@keyframes float{50%{transform:translateY(-10px) rotate(3deg)}}
.bal.bad{animation:shake .35s}.bal.hint{outline:5px solid var(--yel);outline-offset:4px}
@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.bal.gone{animation:burst .18s forwards}@keyframes burst{to{transform:scale(1.5);opacity:0}}
.pt{position:absolute;width:10px;height:10px;border-radius:50%;animation:fly .8s ease-out forwards;pointer-events:none}
@keyframes fly{to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
.msg{text-align:center;font-weight:800;font-size:24px;min-height:36px;margin-top:6px}
.start{position:fixed;inset:0;z-index:5;background:rgba(14,26,58,.82);display:grid;place-items:center;padding:20px}
.start div{background:#fff;color:#14275a;border-radius:36px;padding:28px 26px;text-align:center;max-width:380px;border:5px solid var(--sky)}
.start h2{margin:0 0 6px;font-size:34px;color:var(--pink)}.start p{margin:4px 0 16px;font-size:18px}
.go{font:inherit;font-weight:800;font-size:28px;background:var(--pink);color:#fff;border:0;border-radius:999px;padding:8px 36px;cursor:pointer;box-shadow:0 6px 0 #a81a48}
.c{position:fixed;width:12px;height:12px;border-radius:3px;left:50%;top:40%;animation:cf 1.3s ease-out forwards;pointer-events:none;z-index:4}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(600deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

function initAudio(){try{if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C){AC=new C();master=AC.createGain();master.gain.value=.8;master.connect(AC.destination)}}
  if(AC&&AC.state!=="running")AC.resume();
  if(AC){var o=AC.createOscillator(),g=AC.createGain();g.gain.value=.0001;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.05)}}catch(e){}}
function tone(f,t0,d,type,vol,to){if(!AC||muted)return;var n=AC.currentTime+t0,o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,n);if(to)o.frequency.exponentialRampToValueAtTime(to,n+d);g.gain.setValueAtTime(vol||.25,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(master);o.start(n);o.stop(n+d+.03)}
function noise(d,vol){if(!AC||muted)return;var n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(var i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);var s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=vol;s.connect(g);g.connect(master);s.start()}
var NOTES=[523,659,784];
var sfx={pop:function(p){noise(.1,.4);tone(900,0,.12,"sine",.3,220);tone(NOTES[p||0],.08,.28,"triangle",.28)},
 bad:function(){tone(220,0,.28,"sawtooth",.12,110)},
 win:function(){[523,659,784,1046,1318].forEach(function(f,i){tone(f,i*.1,.35,"triangle",.28)})},
 level:function(){[392,523,659,784,1046,784,1046].forEach(function(f,i){tone(f,i*.09,.3,"square",.12)})}};
function speak(t,lang,rate){if(muted||!window.speechSynthesis)return;try{speechSynthesis.cancel();setTimeout(function(){var u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=rate||.85;var vs=speechSynthesis.getVoices(),p=lang.slice(0,2);for(var i=0;i<vs.length;i++){if(vs[i].lang.indexOf(p)===0){u.voice=vs[i];break}}speechSynthesis.speak(u)},40)}catch(e){}}
/* ---------- game ---------- */
var S=[{n:"Set 1",s:"2 letters",len:2,L:"aitnsmdp",goal:5},{n:"Set 2",s:"a words",len:3,L:"satpnmd",goal:6},{n:"Set 3",s:"i words",len:3,L:"sitpnmd",goal:6},{n:"Set 4",s:"Names",len:3,L:"saimpdnt",goal:3,names:1},{n:"Set 5",s:"4 letters",len:4,L:"satpinmd",goal:5},{n:"Set 6",s:"5 letters",len:5,L:"satpinmd",goal:2}];
var N=["sam","pam","dan","tim","sid"];
var D=("at an as am in is it ad sat pat mat sap tap nap map pan man tan mad sad dad pad tad dam add and sit pit tip nip dip sip pin tin din sin dim did mid nit pip ant aid aim ads its spa apt sand pant past mist mint tint spin spit snap span spat snip tips pins mats taps ants damp dims dips maps mind pads pans pats pint pits sips sits tans tins nips paid pain aids aims dams tads nits stamp stand paint saint satin stain pants mints tints spins spits snaps spans pains").split(" ");
var E={tap:"🚰",nap:"😴",map:"🗺️",pan:"🍳",man:"👨",mad:"😠",sad:"😢",dad:"👨",pad:"📝",add:"➕",sip:"🥤",pin:"📌",tin:"🥫",sam:"👦",pam:"👩",dan:"👦",tim:"👦",sid:"👦",sand:"🏖️",mist:"🌫️",mint:"🌿",spin:"🌀",snip:"✂️",pins:"📌",taps:"🚰",ant:"🐜",spa:"💆",paint:"🎨",stamp:"📮",damp:"💧",maps:"🗺️",pans:"🍳",pain:"🤕",stain:"🫧",sits:"🪑",sit:"🪑",aim:"🎯",aid:"🩹",tip:"💡",dip:"🥣",ants:"🐜"};
var lv=0,len=2,wins=[],found=[],last="",setT=null;
function disp(w){return(S[lv].names&&N.indexOf(w)>=0)?w.charAt(0).toUpperCase()+w.slice(1):w}
function paintLv(){var b=$("lv");b.innerHTML="";S.forEach(function(l,i){var x=document.createElement("button");x.className="lvb"+(i===lv?" on":"");x.innerHTML=l.n+"<small> · "+l.s+"</small>";x.onclick=function(){initAudio();setLevel(i)};b.appendChild(x)})}
function buildSlots(n,anim){var f=$("frame"),old=f.querySelector(".slots");if(old)old.remove();var s=document.createElement("div");s.className="slots "+(anim?"in ":"")+(n===3?"orig":"gen");
  if(n!==3){var g={2:[17.8,17],4:[13.6,11],5:[11,9]}[n];s.style.setProperty("--w",g[0]+"cqw");s.style.setProperty("--fs",g[1]+"cqw")}
  for(var i=0;i<n;i++){var d=document.createElement("div");d.className="win w"+i+(i===0?" next":"");s.appendChild(d)}
  f.appendChild(s);$("cover").style.display=n===3?"none":"block";wins=s.children}
function buildTray(){var t=$("tray");t.innerHTML="";S[lv].L.split("").forEach(function(c,i){var b=document.createElement("button");b.className="bal";b.style.background=COL[i%6];b.style.color=COL[i%6];b.innerHTML="<span style='color:#fff'>"+c+"</span>";b.dataset.c=c;b.setAttribute("aria-label","Letter "+c);b.onclick=function(){tap(b)};t.appendChild(b)})}
function showFound(){var f=$("found");f.innerHTML="";found.forEach(function(w){var s=document.createElement("span");s.textContent=disp(w);f.appendChild(s)});$("prog").textContent="📖 "+found.length+"/"+S[lv].goal}
function ready(){$("msg").style.color="#1f4fd8";$("msg").textContent="Pop balloons to make a word!"}
function clearWins(){cur=[];busy=false;for(var i=0;i<wins.length;i++){wins[i].innerHTML="";wins[i].classList.toggle("next",i===0)}wins[0].parentNode.classList.remove("wrongw");ready()}
function setLevel(i){clearTimeout(setT);lv=i;len=S[i].len;found=[];cur=[];busy=true;last="";paintLv();buildSlots(len,true);buildTray();showFound();wins[0].classList.remove("next");$("em").textContent="❓";
  $("msg").style.color="#1f4fd8";$("msg").textContent="🎉 "+S[i].n+" · "+S[i].s+" — make "+S[i].goal+" words";
  tone(659,0,.15,"triangle",.25);tone(988,.12,.28,"triangle",.25);setT=setTimeout(clearWins,1800)}
function burst(b){var r=b.getBoundingClientRect(),t=$("tray").getBoundingClientRect(),col=b.style.background;
  for(var i=0;i<10;i++){var s=document.createElement("i");s.className="pt";s.style.background=col;s.style.left=(r.left-t.left+r.width/2)+"px";s.style.top=(r.top-t.top+r.height/2)+"px";var a=i*.63,d=40+Math.random()*40;s.style.setProperty("--x",Math.cos(a)*d+"px");s.style.setProperty("--y",Math.sin(a)*d+"px");$("tray").appendChild(s);setTimeout(function(e){e.remove()},900,s)}}
function tap(b){if(busy||b.classList.contains("gone")||cur.length>=len)return;initAudio();var c=b.dataset.c;cur.push(c);var p=cur.length-1;
  wins[p].classList.remove("next");wins[p].innerHTML="<span>"+((S[lv].names&&p===0)?c.toUpperCase():c)+"</span>";if(p+1<len)wins[p+1].classList.add("next");
  sfx.pop(p%3);burst(b);b.classList.add("gone");setTimeout(function(){b.classList.remove("gone");b.classList.add("back");setTimeout(function(){b.classList.remove("back")},450)},220);
  if(cur.length===len)check()}
function check(){busy=true;var w=cur.join(""),s=S[lv],ok=s.names?N.indexOf(w)>=0:(D.indexOf(w)>=0&&w.split("").every(function(c){return s.L.indexOf(c)>=0}));
  if(ok&&found.indexOf(w)>=0){tone(300,0,.2,"triangle",.2);$("msg").style.color="#f59a23";$("msg").textContent="You already made "+disp(w)+"! Make a different one.";setTimeout(clearWins,1800);return}
  if(ok){found.push(w);last=w;stars++;streak++;$("score").textContent="⭐ "+stars;$("streak").textContent="🔥 "+streak;$("em").textContent=E[w]||"🎧";showFound();
    var done=found.length>=s.goal;$("msg").style.color="#6bb52e";$("msg").textContent=done?"Set complete! 🏆 "+disp(w):"✔ "+disp(w)+" ✨";
    if(done)sfx.level();else sfx.win();confetti(done?80:36);setTimeout(function(){speak(disp(w),"en-US",.8)},500);
    setTimeout(function(){if(!done)clearWins();else if(lv+1<S.length)setLevel(lv+1);else{setLevel(0);$("msg").textContent="You finished everything! 🎉"}},done?3400:2200)}
  else{sfx.bad();streak=0;$("streak").textContent="🔥 0";wins[0].parentNode.classList.add("wrongw");$("msg").style.color="#ee2f6b";
    var isW=s.names&&D.indexOf(w)>=0;$("msg").textContent=isW?"❌ That is a word, but not a name. Try again!":"❌ \""+w+"\" is not a word. Try again!";
    speak(isW?"That is a word, but not a name.":"Oops. That is not a word.","en-US",.9);setTimeout(clearWins,2200)}}
function confetti(n){var cs=["#ee2f6b","#1f4fd8","#ffd21f","#6bb52e","#f59a23","#38b6f2"];for(var i=0;i<n;i++){var s=document.createElement("span");s.className="c";s.style.background=cs[i%6];var a=Math.random()*6.28,r=140+Math.random()*320;s.style.setProperty("--x",Math.cos(a)*r+"px");s.style.setProperty("--y",Math.sin(a)*r+"px");document.body.appendChild(s);setTimeout(function(e){e.remove()},1400,s)}}
$("clue").onclick=function(){initAudio();if(last)speak(disp(last),"en-US",.8)};
$("slow").onclick=function(){initAudio();if(last)speak(disp(last),"en-US",.45)};
$("back").onclick=function(){if(busy||!cur.length)return;initAudio();var p=cur.length-1;cur.pop();wins[p].innerHTML="";for(var i=0;i<wins.length;i++)wins[i].classList.toggle("next",i===p);tone(400,0,.08,"triangle",.15)};
function paintMute(){$("mute").textContent=muted?"🔇":"🔊"}
$("mute").onclick=function(){muted=!muted;try{localStorage.setItem("pas-muted",muted?"1":"0")}catch(e){}if(muted&&window.speechSynthesis)try{speechSynthesis.cancel()}catch(e){}else initAudio();paintMute()};
$("go").onclick=function(){initAudio();try{if(window.speechSynthesis){speechSynthesis.getVoices();var u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}}catch(e){}
  $("start").style.display="none";paintMute();tone(523,0,.15,"triangle",.25);tone(784,.12,.25,"triangle",.25);setLevel(0)};
paintMute();paintLv();
</script>
